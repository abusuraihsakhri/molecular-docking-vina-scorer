name: Python and browser checks

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"
      - name: Check Python syntax
        run: python -m compileall -q agents vina_docking_scorer tests
      - name: Run complete Python test suite
        run: python -m pytest -q
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate JavaScript and browser calculations
        run: |
          node --check web/calculator.mjs
          node --test web/test_calculator.mjs
      - name: Audit installed Python dependencies
        if: matrix.python-version == '3.12'
        run: |
          python -m pip install pip-audit
          python -m pip_audit --strict
      - name: Build runtime Docker image
        if: matrix.python-version == '3.12'
        run: docker build -t molecular-docking-vina-scorer:test .
