[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "molecular-docking-vina-scorer"
version = "2.0.0"
description = "VinaScore-Engine: Autonomous Small Molecule Receptor Binding Affinity Predictor"
readme = "README.md"
authors = [{ name = "Dr. Abu Suraih Sakhri", email = "abusuraih@example.com" }]
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Security/Cryptography",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.9"
dependencies = []

[project.scripts]
molecular-docking-vina-scorer = "vina_docking_scorer.cli:main"

[project.urls]
Homepage = "https://github.com/abusuraihsakhri/molecular-docking-vina-scorer"
Repository = "https://github.com/abusuraihsakhri/molecular-docking-vina-scorer.git"
