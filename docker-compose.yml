version: '3.8'

services:
  molecular-docking-vina-scorer:
    build: .
    container_name: molecular-docking-vina-scorer
    ports:
      - "8000:8000"
    environment:
      - AUDIT_SECRET_KEY=molecular-docking-vina-scorer-prod-audit-key-2026
      - MODEL_PROVIDER=mock
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
